<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Cream background matching app brand -->
  <rect width="1920" height="1080" fill="#f4ede1"/>

  <!-- ===== CENTER STACK ===== -->
  <!-- Kicker -->
  <text x="960" y="430" font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="20" font-weight="500" fill="#9c9c9c"
        letter-spacing="7" text-anchor="middle">SAT MAY 16 · ROSEWOOD SAND HILL</text>
  <!-- Title (italic serif) -->
  <text x="960" y="540" font-family="'Georgia', 'Times New Roman', serif"
        font-size="92" font-weight="400" font-style="italic" fill="#1a1a1a"
